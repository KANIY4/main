name: Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Write access is only needed to attach the APK to a published release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        run: ./android/build.sh

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            android/build/meridian-sample-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-sample-debug-apk
          path: android/build/meridian-sample-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/meridian-sample-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
