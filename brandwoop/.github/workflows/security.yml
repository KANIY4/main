name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 03:15 UTC daily — advisories published overnight are caught before work starts.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialise CodeQL
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Critical and high findings fail the build (scope section 11.3).
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Generate SBOM
        run: pnpm licenses list --json > sbom-licences.json

      - name: Upload SBOM
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sbom-licences
          path: sbom-licences.json
          retention-days: 90

  action-pinning:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A floating tag on a third-party action is a supply-chain hole: the tag
      # can be moved to new code after review.
      - name: Reject unpinned actions
        run: |
          set -euo pipefail
          unpinned=$(grep -rhoE 'uses: [^ ]+@[^ ]+' .github/workflows \
            | grep -v '@[0-9a-f]\{40\}' \
            | grep -v 'uses: \./' || true)
          if [ -n "$unpinned" ]; then
            echo "Actions must be pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions pinned to commit SHAs."
