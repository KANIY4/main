name: Release mobile

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Production builds sign with BrandWoop-held credentials, so the job waits
    # for the environment's named approver (scope section 14).
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@f8710a3b9dc85ff28b6f8fc206b04cf1cff65a68 # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # An APK built from a moving branch cannot be tied to a release record.
      - name: Require an immutable tag for production
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git describe --exact-match --tags HEAD

      - name: Build Android artefacts
        env:
          BRANDWOOP_ANDROID_PACKAGE: ${{ vars.BRANDWOOP_ANDROID_PACKAGE }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          profile="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform android --profile "$profile" --non-interactive --wait \
            --json > build-result.json
          cat build-result.json

      # Checksum and signing fingerprint go into the release record so a
      # downloaded APK can be verified against what CI produced.
      - name: Record artefact integrity
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          artefact_url="$(python3 -c "import json;print(json.load(open('build-result.json'))[0]['artifacts']['buildUrl'])")"
          curl -fsSL "$artefact_url" -o brandwoop-release.bin
          checksum="$(sha256sum brandwoop-release.bin | cut -d' ' -f1)"
          {
            echo "## Mobile release"
            echo "- commit: ${{ github.sha }}"
            echo "- artefact: $artefact_url"
            echo "- sha256: $checksum"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksum
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: mobile-release-metadata
          path: apps/mobile/build-result.json
          retention-days: 365
